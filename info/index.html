<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Info — Studio KOBEN</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<script>
    // Use the theme picked on the landing page; fall back to black on white.
    let theme = { bg: '#F0F0F1', fg: '#040405' };
    try { theme = JSON.parse(sessionStorage.getItem('koben-theme')) || theme; } catch (e) {}
    document.documentElement.style.setProperty('--bg', theme.bg);
    document.documentElement.style.setProperty('--fg', theme.fg);
</script>
<style>
    @font-face {
        font-family: 'G2Hyper-Visible';
        src: url('../assets/G2%20HYPER/G2Hyper-Visible.otf') format('opentype');
    }
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        background: var(--bg);
        color: var(--fg);
        font-family: 'G2Hyper-Visible', Arial, Helvetica, sans-serif;
        font-size: 12px;
        text-transform: uppercase;
        line-height: 1.25;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
        text-align: center;
    }
    p {
        max-width: 40ch;
    }
</style>
</head>
<body>
<p>Studio KOBEN is a multi-disciplinary studio run by Lucas Feldstedt, Jan Aas, Marc Palmhøj and Niels Thejls</p>
</body>
</html>
