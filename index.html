<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio KOBEN</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
    @font-face {
        font-family: 'G2Hyper-Visible';
        src: url('assets/G2%20HYPER/G2Hyper-Visible.otf') format('opentype');
    }
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        background: var(--bg);
        color: var(--fg);
        font-family: 'G2Hyper-Visible', Arial, Helvetica, sans-serif;
        font-size: 12px;
        text-transform: uppercase;
        line-height: 1.25;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        text-align: center;
    }
    #typewriter {
        white-space: pre-line;
        position: fixed;
        top: 20px;
        left: 20px;
        text-align: left;
    }
    .cursor {
        display: inline-block;
        animation: blink 0.8s infinite;
    }
    @keyframes blink {
        50% {
            opacity: 0;
        }
    }
    .portfolio-link {
        color: var(--fg);
        text-decoration: none;
        cursor: pointer;
    }
    .portfolio-link:hover {
        text-decoration: underline;
    }
    .about-link {
        position: fixed;
        top: 20px;
        right: 20px;
        color: var(--fg);
        text-decoration: none;
        cursor: pointer;
    }
    .about-link:hover {
        text-decoration: underline;
    }
    .logo {
        position: fixed;
        bottom: 20px;
        left: 20px;
        width: calc(100% - 40px);
        aspect-ratio: 662.1 / 132.5;
        pointer-events: none;
        background-color: var(--fg);
        -webkit-mask-image: url('assets/KOBEN_LOGO_WHITE.svg');
        mask-image: url('assets/KOBEN_LOGO_WHITE.svg');
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-position: left bottom;
        mask-position: left bottom;
    }
</style>
</head>
<body>
<a href="info/" class="about-link">info</a>
<div class="logo" aria-label="KOBEN"></div>
<div id="typewriter"></div>
<script>
    const colorBank = [
        { bg: '#E3311C', fg: '#C2C1C0' },
        { bg: '#2C4798', fg: '#C2C1C0' },
        { bg: '#C2C1C0', fg: '#1C1A1B' },
        { bg: '#EEE229', fg: '#949893' },
        { bg: '#030405', fg: '#53241F' }
    ];
    const combo = colorBank[Math.floor(Math.random() * colorBank.length)];
    document.documentElement.style.setProperty('--bg', combo.bg);
    document.documentElement.style.setProperty('--fg', combo.fg);

    const before = `Studio KOBEN\nA creative office\nSindshvilevej 9a\n2000 Frederiksberg\n\n`;
    const linkText = `Portfolio on request`;
    const element = document.getElementById('typewriter');
    let i = 0;
    let linkInserted = false;
    function type() {
        const full = before + linkText;
        if (i < full.length) {
            if (!linkInserted && i >= before.length) {
                const a = document.createElement('a');
                a.href = 'mailto:hello@koben.studio';
                a.className = 'portfolio-link';
                element.appendChild(a);
                linkInserted = true;
            }
            if (linkInserted) {
                element.querySelector('a').textContent += full.charAt(i);
            } else {
                element.textContent += full.charAt(i);
            }
            i++;
            setTimeout(type, 12);
        }
    }
    type();
</script>
</body>
</html>
